name: Build Distributables

# Triggers:
#   - Push a tag like  git tag v1.2.3 && git push --tags
#   - Or run manually from the Actions tab
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create releases and upload assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt into Node.js 24 before June 2026 deadline

jobs:
  # Tags are a separate workflow from tests.yml, so they need their own gate.
  # Without this job a tag can publish binaries from a commit that never passed
  # either the normal test matrix or the Qt/QML surface.
  release-validate:
    runs-on: ubuntu-latest
    name: release validation (tests + Qt + package metadata)
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag, shared version, and changelog agreement
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="${GITHUB_REF#refs/tags/v}"
          actual="$(python -c 'from firefly.release import __version__; print(__version__)')"
          if [[ "$expected" != "$actual" ]]; then
            echo "Tag v${expected} does not match firefly.release ${actual}" >&2
            exit 1
          fi
          awk -v heading="## v${expected} — " \
            'index($0, heading) == 1 { found=1 } END { exit(found ? 0 : 1) }' \
            CHANGELOG.md || {
              echo "CHANGELOG.md has no exact heading for v${expected}" >&2
              exit 1
            }

      - name: Install full application and test stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          pip install -e ".[dev]"

      - name: Run release tests (including slow regressions)
        run: pytest

      - name: Build package distributions
        run: |
          python -m build
          tar -tf dist/*.tar.gz | grep -q 'firefly/ui/qml/Main.qml'
          tar -tf dist/*.tar.gz | grep -q 'firefly/ui/presets/PC12 Cells.json'

      - name: Clean-install and smoke-test the wheel
        shell: bash
        run: |
          venv="$RUNNER_TEMP/firefly-release-wheel"
          python -m venv "$venv"
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          "$venv/bin/python" -m pip install "$wheel"
          "$venv/bin/python" -m pip check
          (
            cd "$RUNNER_TEMP"
            "$venv/bin/python" -c '
          import os
          from importlib.resources import files
          import firefly
          import firefly.__main__
          import firefly.ui.controllers
          root = files("firefly")
          required = (
              "ui/qml/Main.qml",
              "ui/assets/preview_panels/A.png",
              "ui/presets/PC12 Cells.json",
              "ui/controllers/app_controller.py",
          )
          missing = [p for p in required if not root.joinpath(p).is_file()]
          assert not missing, missing
          assert not os.path.abspath(firefly.__file__).startswith(os.environ["GITHUB_WORKSPACE"])
          '
          )

      - name: Start the clean-installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          marker="$RUNNER_TEMP/firefly-release-ready.marker"
          log="$RUNNER_TEMP/firefly-release-smoke.log"
          rm -f "$marker" "$log"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            LIBGL_ALWAYS_SOFTWARE=1 SPTPALM_READY_MARKER="$marker" \
            "$RUNNER_TEMP/firefly-release-wheel/bin/python" -m firefly \
            >"$log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if [[ -f "$marker" ]]; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              cat "$log" || true
              exit 1
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true
          if [[ "$ready" != 1 ]]; then
            cat "$log" || true
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  #  macOS arm64  →  FIREFLY.app  →  FIREFLY-macOS-arm64.dmg
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: release-validate
    runs-on: macos-latest          # arm64 (M-series); change to macos-13 for Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Apple-Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          python -c 'import platform; assert platform.machine().lower() == "arm64"'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PyInstaller is pinned and validated on 3.12; the runtime project
          # itself supports 3.12/3.13 with NumPy 2 and no napari dependency.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller==6.11.1"   # pinned for reproducible Tcl/Tk bundling behaviour

      - name: Inject release tag into shared release metadata
        # One shared helper keeps source metadata, the pyproject dynamic version,
        # and the macOS bundle plist aligned with the release tag.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Stamping release version = ${TAG}"
          python scripts/stamp_version.py "${TAG}"
          grep '^__version__' firefly/release.py

      - name: Build .app
        env:
          FIREFLY_BUILD_NUMBER: ${{ github.run_number }}
        run: pyinstaller sptpalm.spec --noconfirm --clean

      - name: Verify bundle version metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF#refs/tags/v}"
          else
            expected="$(python -c 'from firefly.ui._appversion import app_version; print(app_version())')"
          fi
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/FIREFLY.app/Contents/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/FIREFLY.app/Contents/Info.plist)
          release=$(/usr/libexec/PlistBuddy -c 'Print :FIREFLYReleaseVersion' dist/FIREFLY.app/Contents/Info.plist)
          [[ "$short" == "${expected%%-*}" ]]
          [[ "$build" == "$GITHUB_RUN_NUMBER" ]]
          [[ "$release" == "$expected" ]]
          echo "Info.plist versions OK: ${short} (build ${build}; FIREFLY ${release})"

      - name: Smoke test (.app)
        shell: bash
        run: |
          marker="$RUNNER_TEMP/sptpalm_macos_ready.marker"
          log="$RUNNER_TEMP/sptpalm_macos_smoke.log"
          rm -f "$marker" "$log"
          export SPTPALM_READY_MARKER="$marker"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          export LIBGL_ALWAYS_SOFTWARE=1
          "dist/FIREFLY.app/Contents/MacOS/FIREFLY" >"$log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if [[ -f "$marker" ]]; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "FATAL: FIREFLY.app exited before the ready marker"
              cat "$log" || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "FATAL: FIREFLY.app did not signal ready within 120 seconds"
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
            cat "$log" || true
            exit 1
          fi
          echo "OK: FIREFLY.app wrote the ready marker"
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true

      - name: Create DMG
        # hdiutil intermittently returns "Resource busy" on GitHub's
        # macOS runners — Spotlight (mds_stores) and fseventsd index
        # the freshly-extracted .app bundle in the background, holding
        # an FS handle that prevents the create-disk-image step from
        # locking the source folder.  Two-pronged fix:
        #   1. Detach any leftover FIREFLY volume from a prior run
        #      that didn't clean itself up.
        #   2. Retry the create with exponential backoff so we ride
        #      out the indexer's window without failing the build.
        run: |
          # Best-effort: unmount any stale FIREFLY volume left over
          # from a previous run on the same runner image.
          for vol in /Volumes/FIREFLY*; do
            if [ -d "$vol" ]; then
              echo "Detaching stale volume: $vol"
              hdiutil detach "$vol" -force || true
            fi
          done
          # Wait briefly so Spotlight finishes indexing the bundle
          # PyInstaller just dropped.
          sleep 5
          # Retry loop — 4 attempts, 5/10/20 s backoff.
          for attempt in 1 2 3 4; do
            echo "hdiutil create attempt $attempt …"
            if hdiutil create \
                -volname "FIREFLY" \
                -srcfolder "dist/FIREFLY.app" \
                -ov -format UDZO \
                "dist/FIREFLY-macOS-arm64.dmg"; then
              echo "DMG created on attempt $attempt"
              break
            fi
            if [ $attempt -eq 4 ]; then
              echo "DMG creation failed after 4 attempts"
              exit 1
            fi
            backoff=$((attempt * 5))
            echo "  → 'Resource busy' or similar; sleeping ${backoff}s before retry"
            sleep $backoff
          done
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIREFLY-macOS-arm64
          path: dist/FIREFLY-macOS-arm64.dmg
          retention-days: 30

      - name: Release notes from CHANGELOG
        # The release body (what the in-app "Updates" card shows) is the CHANGELOG
        # section for this exact version. Release validation already requires
        # that heading, so a fallback could only hide a broken release contract.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FULL="${GITHUB_REF#refs/tags/v}"      # e.g. 2.76.45-rc.6
          extract() {
            awk -v v="$1" '
              index($0, "## v" v " ")==1 {grab=1; print; next}
              grab && /^## v/ {exit}
              grab {print}
            ' CHANGELOG.md
          }
          extract "$FULL" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FIREFLY-macOS-arm64.dmg
          body_path: RELEASE_NOTES.md
          # A tag with a pre-release suffix (e.g. v2.76.39-rc.1) publishes a
          # GitHub *pre-release* — the Pre-release update channel installs it,
          # the Stable channel skips it, and it never becomes "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  #  Windows  →  FIREFLY.exe
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: release-validate
    runs-on: windows-latest
    # Both platform artifacts wait for the release-validation job, but build and
    # upload independently once that gate has passed.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PyInstaller is pinned and validated on 3.12; the runtime project
          # itself supports 3.12/3.13 with NumPy 2 and no napari dependency.
          python-version: "3.12"

      - name: Install dependencies
        # The bundled Windows .exe ships CPU-only torch.
        #
        # We TRIED CUDA wheels (cu118 + cu124) but every variant pushed
        # the final .exe past GitHub Releases' 2,147,483,648-byte asset
        # cap (cu118 → 2.98 GB, cu124 → ~3.2 GB).  PyInstaller's LZMA
        # compression can't meaningfully shrink already-compiled CUDA
        # DLL blobs, so no CUDA wheel will fit.
        #
        # Users who need GPU acceleration on Windows should follow the
        # "Run from source for CUDA support" section in README.md — that
        # installs torch from PyTorch's own index against a local Python
        # interpreter, which has no asset-size constraint.
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          pip install -e .
          pip install "pyinstaller==6.11.1"   # pinned for reproducible bundling behaviour

      - name: Inject release tag into shared release metadata
        # Use the same cross-platform stamping helper as the macOS build.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          Write-Host "Stamping release version = $tag"
          python scripts/stamp_version.py $tag
          if ($LASTEXITCODE -ne 0) { Write-Error "Version stamp failed"; exit 1 }
          Select-String -Path firefly/release.py -Pattern '^__version__'

      - name: Build exe (onefile)
        # Spec produces a single self-contained FIREFLY.exe.  All binaries
        # (Qt, torch, scientific Python) bundled inside; extracted
        # to %TEMP% at runtime — no chance of user extraction dropping files.
        run: pyinstaller sptpalm.spec --noconfirm --clean

      - name: Verify exe exists and is reasonable size
        shell: pwsh
        run: |
          $exe = "dist\FIREFLY.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "FATAL: $exe not produced by build"
            exit 1
          }
          $sizeBytes = (Get-Item $exe).Length
          $sizeMB = $sizeBytes / 1MB
          Write-Host ("FIREFLY.exe size: {0:N1} MB" -f $sizeMB)
          if ($sizeMB -lt 50) {
            Write-Error "FATAL: $exe is suspiciously small ($sizeMB MB) — bundle is incomplete"
            exit 1
          }
          # GitHub Releases caps individual assets at 2 GiB (2,147,483,648
          # bytes).  Fail HERE with a clear message instead of letting the
          # upload step error out cryptically with
          #   "Validation Failed: size must be less than 2147483648"
          $cap = 2147483648
          if ($sizeBytes -ge $cap) {
            Write-Error ("FATAL: $exe is {0:N0} bytes — GitHub Releases cap is {1:N0}.  Switch to a smaller CUDA wheel or revert to CPU torch." -f $sizeBytes, $cap)
            exit 1
          }

      - name: Smoke test (launch the onefile exe)
        shell: pwsh
        run: |
          # Marker-file handshake: app writes a file only AFTER the
          # PySide6 main window shows and repaints.  Catches startup
          # crashes that PyInstaller hides behind an error dialog
          # (which would otherwise keep HasExited false).
          $exe    = "dist\FIREFLY.exe"
          $marker = Join-Path $env:RUNNER_TEMP "sptpalm_ready.marker"
          Remove-Item -Path $marker -ErrorAction SilentlyContinue
          $env:SPTPALM_READY_MARKER = $marker

          Write-Host "Launching $exe (onefile bootloader will extract to TEMP — first launch is slower)..."
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden

          # Onefile cold-start: bootloader extracts ~200 MB of files to %TEMP%
          # then Python loads numpy + scipy + matplotlib + trackpy from a
          # cold disk cache.  120s is generous but not flaky.
          $deadline = (Get-Date).AddSeconds(120)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $marker) { $ready = $true; break }
            if ($proc.HasExited) {
              Write-Error "FATAL: process exited with code $($proc.ExitCode) before writing ready marker"
              exit 1
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Error "FATAL: app did not signal ready within 120s — startup crash hidden by error dialog"
            try { $proc.Kill() } catch {}
            exit 1
          }
          Write-Host "OK: ready marker written — onefile bundle is healthy"
          # Kill the WHOLE process tree.  PyInstaller onefile spawns a CHILD
          # process that also holds FIREFLY.exe open, so killing only $proc
          # leaves the exe locked and the later rename fails with "the process
          # cannot access the file because it is being used by another process".
          # /T terminates the child too; the name-based kill mops up any
          # reparented straggler.
          taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          Stop-Process -Name FIREFLY -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Rename exe for release
        # Releases page shows whatever filename we upload — match the
        # name the README tells users to download.
        shell: pwsh
        run: |
          # Even after the tree is killed, the freshly-built 200 MB exe can be
          # briefly locked by a teardown straggler or Windows Defender scanning
          # a brand-new binary.  Retry the rename rather than failing the whole
          # release build on a transient lock.
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              Move-Item dist\FIREFLY.exe dist\FIREFLY-Windows.exe -Force -ErrorAction Stop
              $ok = $true; break
            } catch {
              Write-Host "Rename attempt $i failed (file locked); killing stragglers + retrying in 3s..."
              Stop-Process -Name FIREFLY -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ok) { Write-Error "FIREFLY.exe still locked after 12 attempts"; exit 1 }
          Write-Host "Renamed: $(Get-Item dist\FIREFLY-Windows.exe)"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIREFLY-Windows
          path: dist\FIREFLY-Windows.exe
          retention-days: 30

      - name: Release notes from CHANGELOG
        # Same as the macOS job — the CHANGELOG section for this version becomes
        # the release body.  Windows also writes it so the release is complete
        # even if the macOS job is skipped or fails.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $full = ($env:GITHUB_REF -replace '^refs/tags/v','')   # 2.76.45-rc.6
          function Extract($v) {
            $prefix = "## v$v "
            $out = @(); $grab = $false
            foreach ($l in (Get-Content CHANGELOG.md)) {
              if ($l.StartsWith($prefix)) { $grab = $true; $out += $l; continue }
              if ($grab -and $l -match '^## v') { break }
              if ($grab) { $out += $l }
            }
            return $out
          }
          $out = Extract $full
          if ($out.Count -eq 0) { throw "Missing exact CHANGELOG entry for v$full" }
          ($out -join "`n") | Set-Content -Encoding UTF8 RELEASE_NOTES.md
          Write-Host "---- release notes ----"; Get-Content RELEASE_NOTES.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\FIREFLY-Windows.exe
          body_path: RELEASE_NOTES.md
          # See the macOS job: a hyphenated tag ships a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
