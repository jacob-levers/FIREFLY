name: Tests

# Fast numerical-regression gate, independent of the release build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: pytest (py${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Only the analysis stack is needed — no Qt / napari / CZI loaders.
        # numpy 2.x + CPU-only torch 2.6+; both ship cp313 wheels so the
        # matrix validates Python 3.13 compatibility of the analysis core.
        # (The engine-agreement test skips automatically if torch is absent.)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2,<3" "pandas>=2.2,<3" scipy matplotlib \
                      scikit-image trackpy joblib tqdm scikit-learn psutil \
                      threadpoolctl pytest
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"

      - name: Run tests
        run: pytest
