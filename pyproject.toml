[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-sptpalm"
description = "FIREFLY — sptPALM single-particle-tracking PALM analysis (PySide6 GUI + analysis pipeline)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "jacob-levers" }]
dynamic = ["version"]

# Runtime dependencies are declared here.  requirements.txt intentionally
# installs this project in editable mode so source launchers resolve this same
# metadata rather than maintaining a second dependency list.
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scipy",
    "matplotlib",
    "scikit-image",
    "trackpy",
    "numba>=0.61",
    "joblib",
    "tqdm",
    "czifile",
    "imagecodecs",
    "aicspylibczi",
    "tifffile",
    "imageio",
    "Pillow",
    "psutil",
    "scikit-learn",
    "pingouin>=0.6,<0.7",
    "threadpoolctl",
    "torch>=2.6,<3",
    "roifile>=2024.5.24",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest", "pypdf", "build"]

[project.urls]
Homepage = "https://github.com/jacob-levers/FIREFLY"

# Launch the GUI with ``python -m firefly`` (or ``python run_firefly.py`` from a
# source checkout).  We intentionally do not expose a console-script entry
# point: the module-level ``__main__`` guard is the stable multiprocessing-spawn
# boundary used by both normal Python and the frozen PyInstaller executable.

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["firefly*"]

[tool.setuptools.package-data]
# The QML front end resolves these files relative to its package at run time.
# Keep the wheel manifest explicit: PyInstaller's own data collection only
# covers frozen builds and cannot make a normal ``pip install`` runnable.
firefly = [
    "CHANGELOG.md",
    "ui/qml/*.qml",
    "ui/qml/**/*.qml",
    "ui/qml/assets/figures/*.png",
    "ui/qml/assets/icons/*.svg",
    "ui/assets/preview_panels/*.png",
    "ui/presets/*.json",
]

[tool.setuptools.dynamic]
# Standard-library-only release metadata is shared by package builds, the UI,
# updater, and PyInstaller spec.
version = { attr = "firefly.release.__version__" }
